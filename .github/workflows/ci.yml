name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify documentation
        run: node scripts/verify-docs.mjs

      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$PR_BASE_SHA" HEAD

      - name: Check commit whitespace
        if: github.event_name != 'pull_request'
        run: git show --format= --check HEAD

      # Replace this guard with real install/lint/typecheck/test/build steps
      # in the same PR that introduces the app. Do not silently skip app tests.
      - name: Require app CI when scaffolding
        shell: bash
        run: |
          tracked_files="$(git ls-files)"
          if grep -Eq '(^|/)package\.json$' <<< "$tracked_files"; then
            echo '::error::App/package detected. Add real app CI before removing this guard; see docs/ci-og-deploy.md.'
            exit 1
          fi
