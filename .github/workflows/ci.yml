name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: false
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify documentation
        run: node scripts/verify-docs.mjs

      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$PR_BASE_SHA" HEAD

      - name: Check commit whitespace
        if: github.event_name != 'pull_request'
        run: git show --format= --check HEAD

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Install test browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Typecheck, lint, tests, local D1, build and browser tests
        working-directory: app
        run: npm run check

      - name: Retain test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/coverage
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore
