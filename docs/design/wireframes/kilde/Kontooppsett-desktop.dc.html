<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Kontooppsett, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-kontooppsett-desktop a{color:#1f1f1f}.s-kontooppsett-desktop a:hover{color:#000000}
.s-kontooppsett-desktop .wf-input{box-sizing:border-box;width:100%;height:52px;padding:0 14px;font:inherit;font-size:18px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-kontooppsett-desktop .wf-input[readonly]{background:#ecebe8;border-style:dashed}
.s-kontooppsett-desktop .wf-input:focus-visible,.s-kontooppsett-desktop .wf-btn:focus-visible,.s-kontooppsett-desktop a:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
</style>
</helmet>
<div class="s-kontooppsett-desktop" style="width: 1280px; height: 800px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header style="height: 72px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #c9c8c3; background: #ffffff">
<div style="width: 36px; height: 36px; border: 2px solid #6f6f6b; border-radius: 6px; background: #dcdbd6"></div>
<span style="font-size: 20px; font-weight: 700">[Appnavn]</span>
</header>
<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 520px; box-sizing: border-box; padding: 44px 48px; background: #ffffff; border: 2px solid #c9c8c3; border-radius: 10px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.15">Fullfør kontoen</h1>
<form style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="kd-epost" style="font-size: 16px; font-weight: 600">E-post</label>
<input id="kd-epost" class="wf-input" type="email" value="ola123@hiof.no" readonly>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="kd-navn" style="font-size: 16px; font-weight: 600">Fullt navn</label>
<input id="kd-navn" class="wf-input" type="text" autocomplete="name">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="kd-tlf" style="font-size: 16px; font-weight: 600">Telefonnummer</label>
<input id="kd-tlf" class="wf-input" type="tel" autocomplete="tel">
</div>
<a href="Sok-desktop.dc.html" class="wf-btn" style="box-sizing: border-box; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #2b2b2b; color: #ffffff; font-size: 18px; font-weight: 600; text-decoration: none">Fullfør</a>
</form>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
