<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Send låneforespørsel, mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-foresporsel-leie-mobil a{color:#1f1f1f}.s-foresporsel-leie-mobil a:hover{color:#000000}
.s-foresporsel-leie-mobil h1{margin:0;font-size:28px;line-height:1.2}.s-foresporsel-leie-mobil h2{margin:0;font-size:20px;line-height:1.3}.s-foresporsel-leie-mobil p{margin:0}
.s-foresporsel-leie-mobil .hdr{height:60px;box-sizing:border-box;padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c9c8c3;background:#ffffff;flex-shrink:0}
.s-foresporsel-leie-mobil .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;text-decoration:none;color:#1f1f1f}
.s-foresporsel-leie-mobil .logo{width:32px;height:32px;box-sizing:border-box;border:2px solid #6f6f6b;border-radius:6px;background:#dcdbd6}
.s-foresporsel-leie-mobil .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;padding:0}
.s-foresporsel-leie-mobil .in{box-sizing:border-box;width:100%;height:48px;padding:0 14px;font:inherit;font-size:17px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-foresporsel-leie-mobil .fld{display:flex;flex-direction:column;gap:8px}.s-foresporsel-leie-mobil .lbl{font-size:16px;font-weight:600}
.s-foresporsel-leie-mobil .help{font-size:15px;line-height:1.45;color:#4a4a47}
.s-foresporsel-leie-mobil .btn{box-sizing:border-box;min-height:52px;padding:0 22px;border:2px solid #2b2b2b;border-radius:6px;background:#2b2b2b;color:#ffffff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.s-foresporsel-leie-mobil .card{border:2px solid #c9c8c3;border-radius:8px;background:#ffffff}
.s-foresporsel-leie-mobil .ph{background:#dcdbd6}
.s-foresporsel-leie-mobil .open{padding:12px 14px;border:2px dashed #8a8a86;border-radius:6px;font-size:15px;line-height:1.45;color:#4a4a47}
.s-foresporsel-leie-mobil .who{align-self:flex-start;padding:6px 12px;border:2px dashed #6f6f6b;border-radius:6px;font-size:14px;font-weight:600;color:#4a4a47;background:#ffffff}
.s-foresporsel-leie-mobil .back{align-self:flex-start;padding:10px 0;font-size:16px}
.s-foresporsel-leie-mobil .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.s-foresporsel-leie-mobil .wd{font-size:13px;font-weight:600;text-align:center;color:#4a4a47;padding:4px 0}
.s-foresporsel-leie-mobil .day{height:40px;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:4px;box-sizing:border-box}
.s-foresporsel-leie-mobil .free{background:#ffffff;border:1px solid #c9c8c3}
.s-foresporsel-leie-mobil .busy{background:repeating-linear-gradient(45deg,#c9c8c3 0 4px,#e6e5e1 4px 8px);text-decoration:line-through}
.s-foresporsel-leie-mobil .sel{background:#2b2b2b;color:#ffffff;font-weight:700}
.s-foresporsel-leie-mobil a:focus-visible,.s-foresporsel-leie-mobil button:focus-visible,.s-foresporsel-leie-mobil input:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
</style>
</helmet>
<div class="s-foresporsel-leie-mobil" style="width: 390px; height: 1800px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header class="hdr"><a href="Sok-mobil.dc.html" class="brand"><span class="logo"></span>[Appnavn]</a></header>
<main style="padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 22px">
<div class="who">Visning: låner</div>
<a href="Annonse-leie-mobil.dc.html" class="back">‹ Tilbake til annonsen</a>
<h1>Send låneforespørsel</h1>
<div class="card" style="padding: 12px; display: flex; gap: 12px; align-items: center">
<div class="ph" style="width: 72px; height: 72px; border-radius: 6px; flex-shrink: 0"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Skjerm 24 tommer</strong><span style="font-size: 16px">Lån · 100 kr per uke</span><span class="help">Eier: [Fornavn]</span></div>
</div>
<form style="display: flex; flex-direction: column; gap: 22px">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2>Velg periode</h2>
<p class="help">Minst én uke</p>
<div style="display: flex; align-items: center; justify-content: space-between"><button type="button" class="ib" aria-label="Forrige måned" style="font-size: 22px">‹</button><strong style="font-size: 17px">Oktober 2026</strong><button type="button" class="ib" aria-label="Neste måned" style="font-size: 22px">›</button></div>
<div class="cal">
<span class="wd">Ma</span><span class="wd">Ti</span><span class="wd">On</span><span class="wd">To</span><span class="wd">Fr</span><span class="wd">Lø</span><span class="wd">Sø</span>
<sc-for list="{{ days }}" as="d" hint-placeholder-count="34">
<div>
<sc-if value="{{ d.busy }}" hint-placeholder-val="{{ false }}"><div class="day busy" aria-label="{{ d.label }}">{{ d.n }}</div></sc-if>
<sc-if value="{{ d.sel }}" hint-placeholder-val="{{ false }}"><button type="button" class="day sel" aria-pressed="true" style="width: 100%; border: 0; font: inherit; font-weight: 700">{{ d.n }}</button></sc-if>
<sc-if value="{{ d.free }}" hint-placeholder-val="{{ true }}"><button type="button" class="day free" style="width: 100%; font: inherit; cursor: pointer">{{ d.n }}</button></sc-if>
</div>
</sc-for>
</div>
</section>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div class="fld"><label for="fl-fra" class="lbl">Fra</label><input id="fl-fra" class="in" type="text" value="20.10.2026"></div>
<div class="fld"><label for="fl-til" class="lbl">Til</label><input id="fl-til" class="in" type="text" value="30.10.2026"></div>
</div>
<section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h2>Oppsummering</h2>
<div style="display: flex; justify-content: space-between; font-size: 17px"><span>20.10–30.10 (10 dager)</span><strong>142,86 kr</strong></div>
</section>
<button type="button" class="btn">Send forespørsel</button>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1800}}'>
class Component extends DCLogic {
renderVals() {
const days = [];
for (let i = 0; i < 3; i++) days.push({ n: '', busy: false, sel: false, free: false });
for (let d = 1; d <= 31; d++) {
const busy = d >= 5 && d <= 18;
const sel = d >= 20 && d <= 30;
days.push({ n: d, busy: busy, sel: sel, free: !busy && !sel, label: d + '. oktober, opptatt' });
}
return { days: days };
}
}
</script>
</body>
</html>
