<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.gj-btn{box-sizing:border-box;min-height:48px;padding:0 16px;border:1px solid #5a5a5a;border-radius:4px;background:transparent;color:#f2f2f2;font:inherit;font-size:15px;cursor:pointer}
.gj-btn.gj-pri{background:#f2f2f2;color:#111111;border-color:#f2f2f2}
.gj-btn:disabled{opacity:0.3;cursor:default}
.gj-seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #5a5a5a;border-radius:4px;overflow:hidden}
.gj-seg button{min-height:40px;border:0;font:inherit;font-size:14px;cursor:pointer;background:transparent;color:#bdbdbd}
.gj-seg button[aria-pressed=true]{background:#f2f2f2;color:#111111}
.gj-seg button:disabled{color:#5a5a5a;cursor:default}
.gj-btn:focus-visible,.gj-seg button:focus-visible,.gj-sel:focus-visible{outline:2px solid #f2f2f2;outline-offset:2px}
.gj-sel{box-sizing:border-box;width:100%;height:44px;padding:0 10px;font:inherit;font-size:14px;border:1px solid #5a5a5a;border-radius:4px;background:#1f1f1f;color:#f2f2f2}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; box-sizing: border-box; display: flex; background: #2b2b2b">

<div style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #9a9a9a"><span>{{ wf }}</span><span>{{ counter }}</span></div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.2">{{ title }}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #d6d6d6">{{ desc }}</p>
<div class="gj-seg" role="group" aria-label="Skjermstørrelse">
<button type="button" aria-pressed="{{ mPressed }}" disabled="{{ mDisabled }}" onClick="{{ showM }}">Mobil</button>
<button type="button" aria-pressed="{{ dPressed }}" disabled="{{ dDisabled }}" onClick="{{ showD }}">Desktop</button>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<label for="gj-hopp" style="font-size: 13px; color: #9a9a9a">Gå til skjerm</label>
<select id="gj-hopp" class="gj-sel" value="{{ idx }}" onChange="{{ jump }}">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="26"><option value="{{ o.value }}">{{ o.label }}</option></sc-for>
</select>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" class="gj-btn" disabled="{{ atStart }}" onClick="{{ prev }}">‹ Forrige</button>
<button type="button" class="gj-btn gj-pri" disabled="{{ atEnd }}" onClick="{{ next }}">Neste ›</button>
</div>
</div>
