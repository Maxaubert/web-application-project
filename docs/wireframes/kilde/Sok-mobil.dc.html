<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Annonser og søk, mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-sok-mobil a{color:#1f1f1f}.s-sok-mobil a:hover{color:#000000}
.s-sok-mobil .wf-input{box-sizing:border-box;width:100%;height:48px;padding:0 14px;font-size:17px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-sok-mobil .wf-input:focus-visible,.s-sok-mobil .wf-btn:focus-visible,.s-sok-mobil a:focus-visible,.s-sok-mobil input[type=radio]:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
.s-sok-mobil input[type=radio]{width:22px;height:22px;margin:0;accent-color:#2b2b2b}
</style>
</helmet>
<div class="s-sok-mobil" style="width: 390px; height: 1560px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header style="height: 60px; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #c9c8c3; background: #ffffff">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border: 2px solid #6f6f6b; border-radius: 6px; background: #dcdbd6"></div>
<span style="font-size: 18px; font-weight: 700">[Appnavn]</span>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<a href="Legg-ut-mobil.dc.html" style="height: 44px; padding: 0 14px; display: flex; align-items: center; border: 2px solid #1f1f1f; border-radius: 6px; font-size: 16px; font-weight: 600; text-decoration: none">Legg ut</a>
<button type="button" aria-label="Meny" class="wf-btn" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
</button>
</div>
</header>
<main style="padding: 24px 16px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.15">Annonser</h1>
<form role="search" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sm-q" style="font-size: 16px; font-weight: 600">Søk i tittel og beskrivelse</label>
<div style="display: flex; gap: 8px">
<input id="sm-q" class="wf-input" type="search" value="kalkulator">
<button type="button" class="wf-btn" style="flex-shrink: 0; height: 48px; padding: 0 18px; border: 0; border-radius: 6px; background: #2b2b2b; color: #ffffff; font-size: 17px; font-weight: 600; cursor: pointer">Søk</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sm-kat" style="font-size: 16px; font-weight: 600">Kategori</label>
<select id="sm-kat" class="wf-input"><option>Alle kategorier</option><option>[Fast kategoriliste]</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sm-type" style="font-size: 16px; font-weight: 600">Handelstype</label>
<select id="sm-type" class="wf-input"><option>Alle typer</option><option>Salg</option><option>Lån</option><option>Gis bort</option></select>
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 600">Lån</legend>
<div style="display: flex; gap: 24px">
<label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 17px"><input type="radio" name="sm-tilg"> Tilgjengelig nå</label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 17px"><input type="radio" name="sm-tilg" checked> Alle</label>
</div>
</fieldset>
</form>
<p style="margin: 0; font-size: 16px; color: #4a4a47" aria-live="polite">[Antall] annonser</p>
<div style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{ cards }}" as="card" hint-placeholder-count="3">
<a href="{{ card.href }}" style="display: flex; flex-direction: column; border: 2px solid #c9c8c3; border-radius: 8px; background: #ffffff; text-decoration: none; overflow: hidden">
<div style="height: 190px; background: #dcdbd6; display: flex; align-items: center; justify-content: center">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8a8a86" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>
</div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 18px; line-height: 1.3">{{ card.title }}</strong>
<span style="font-size: 17px; font-weight: 600">{{ card.price }}</span>
<span style="font-size: 15px; color: #4a4a47">{{ card.avail }}</span>
</div>
</a>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
renderVals() {
return {
cards: [
{ title: 'Casio fx-991 kalkulator', price: 'Salg · 250 kr', avail: 'Til salgs', href: 'Annonse-mobil.dc.html' },
{ title: 'Grafisk kalkulator TI-84', price: 'Lån · gratis', avail: 'Utlånt, ledig fra 15.10', href: 'Annonse-leie-mobil.dc.html' },
{ title: 'Kalkulatorbok med løsninger', price: 'Gis bort', avail: 'Tilgjengelig', href: 'Annonse-mobil.dc.html' }
]
};
}
}
</script>
</body>
</html>
