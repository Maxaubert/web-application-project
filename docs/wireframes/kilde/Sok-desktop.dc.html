<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Annonser og søk, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-sok-desktop a{color:#1f1f1f}.s-sok-desktop a:hover{color:#000000}
.s-sok-desktop .wf-input{box-sizing:border-box;width:100%;height:48px;padding:0 14px;font-size:17px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-sok-desktop .wf-input:focus-visible,.s-sok-desktop .wf-btn:focus-visible,.s-sok-desktop a:focus-visible,.s-sok-desktop input[type=radio]:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
.s-sok-desktop input[type=radio]{width:22px;height:22px;margin:0;accent-color:#2b2b2b}
</style>
</helmet>
<div class="s-sok-desktop" style="width: 1440px; height: 1100px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header style="height: 72px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #c9c8c3; background: #ffffff">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; border: 2px solid #6f6f6b; border-radius: 6px; background: #dcdbd6"></div>
<span style="font-size: 20px; font-weight: 700">[Appnavn]</span>
</div>
<nav aria-label="Hovedmeny" style="display: flex; align-items: center; gap: 32px; font-size: 17px">
<a href="#" aria-current="page" style="padding: 12px 0; font-weight: 700; text-decoration-thickness: 3px; text-underline-offset: 6px">Annonser</a>
<a href="Minside-desktop.dc.html" style="padding: 12px 0">Min side</a>
<a href="Legg-ut-desktop.dc.html" style="height: 44px; padding: 0 18px; display: flex; align-items: center; border: 2px solid #1f1f1f; border-radius: 6px; font-weight: 600; text-decoration: none">Legg ut annonse</a>
</nav>
</header>
<main style="flex-grow: 1; padding: 40px 48px; display: flex; gap: 40px">
<aside style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-size: 20px">Filtre</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sd-kat" style="font-size: 16px; font-weight: 600">Kategori</label>
<select id="sd-kat" class="wf-input"><option>Alle kategorier</option><option>[Fast kategoriliste]</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sd-type" style="font-size: 16px; font-weight: 600">Handelstype</label>
<select id="sd-type" class="wf-input"><option>Alle typer</option><option>Salg</option><option>Lån</option><option>Gis bort</option></select>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 16px; font-weight: 600">Lån</legend>
<label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 17px"><input type="radio" name="sd-tilg"> Tilgjengelig nå</label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 17px"><input type="radio" name="sd-tilg" checked> Alle</label>
</fieldset>
</aside>
<section style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 30px; line-height: 1.15">Annonser</h1>
<form role="search" style="display: flex; flex-direction: column; gap: 8px">
<label for="sd-q" style="font-size: 16px; font-weight: 600">Søk i tittel og beskrivelse</label>
<div style="display: flex; gap: 12px">
<input id="sd-q" class="wf-input" type="search" value="kalkulator">
<button type="button" class="wf-btn" style="flex-shrink: 0; height: 48px; padding: 0 28px; border: 0; border-radius: 6px; background: #2b2b2b; color: #ffffff; font-size: 17px; font-weight: 600; cursor: pointer">Søk</button>
</div>
</form>
<p style="margin: 0; font-size: 16px; color: #4a4a47" aria-live="polite">[Antall] annonser</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{ cards }}" as="card" hint-placeholder-count="6">
<a href="{{ card.href }}" style="display: flex; flex-direction: column; border: 2px solid #c9c8c3; border-radius: 8px; background: #ffffff; text-decoration: none; overflow: hidden">
<div style="height: 170px; background: #dcdbd6; display: flex; align-items: center; justify-content: center">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8a8a86" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>
</div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 18px; line-height: 1.3">{{ card.title }}</strong>
<span style="font-size: 17px; font-weight: 600">{{ card.price }}</span>
<span style="font-size: 15px; color: #4a4a47">{{ card.avail }}</span>
</div>
</a>
</sc-for>
</div>
<button type="button" class="wf-btn" style="align-self: center; height: 48px; padding: 0 28px; border: 2px solid #1f1f1f; border-radius: 6px; background: #ffffff; color: #1f1f1f; font-size: 17px; font-weight: 600; cursor: pointer">Vis flere</button>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
return {
cards: [
{ title: 'Casio fx-991 kalkulator', price: 'Salg · 250 kr', avail: 'Til salgs', href: 'Annonse-desktop.dc.html' },
{ title: 'Grafisk kalkulator TI-84', price: 'Lån · gratis', avail: 'Utlånt, ledig fra 15.10', href: 'Annonse-leie-desktop.dc.html' },
{ title: 'Kalkulator for økonomifag', price: 'Lån · 40 kr/uke', avail: 'Tilgjengelig nå', href: 'Annonse-leie-desktop.dc.html' },
{ title: 'Kalkulatorbok med løsninger', price: 'Gis bort', avail: 'Tilgjengelig', href: 'Annonse-desktop.dc.html' },
{ title: 'Casio kalkulator, som ny', price: 'Lån · gratis', avail: 'Tilgjengelig nå', href: 'Annonse-leie-desktop.dc.html' },
{ title: 'HP finanskalkulator', price: 'Lån · 50 kr/uke', avail: 'Utlånt, ledig fra 03.11', href: 'Annonse-leie-desktop.dc.html' }
]
};
}
}
</script>
</body>
</html>
