<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Send låneforespørsel, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-foresporsel-leie-desktop a{color:#1f1f1f}.s-foresporsel-leie-desktop a:hover{color:#000000}
.s-foresporsel-leie-desktop h1{margin:0;font-size:32px;line-height:1.2}.s-foresporsel-leie-desktop h2{margin:0;font-size:20px;line-height:1.3}.s-foresporsel-leie-desktop p{margin:0}
.s-foresporsel-leie-desktop .dhdr{height:72px;box-sizing:border-box;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c9c8c3;background:#ffffff;flex-shrink:0}
.s-foresporsel-leie-desktop .brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;text-decoration:none;color:#1f1f1f}
.s-foresporsel-leie-desktop .logo{width:36px;height:36px;box-sizing:border-box;border:2px solid #6f6f6b;border-radius:6px;background:#dcdbd6}
.s-foresporsel-leie-desktop .nav{display:flex;align-items:center;gap:32px;font-size:17px}.s-foresporsel-leie-desktop .nav a{padding:12px 0}
.s-foresporsel-leie-desktop .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;padding:0}
.s-foresporsel-leie-desktop .in{box-sizing:border-box;width:100%;height:48px;padding:0 14px;font:inherit;font-size:17px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-foresporsel-leie-desktop .in.err{border:3px solid #1f1f1f}
.s-foresporsel-leie-desktop .fld{display:flex;flex-direction:column;gap:8px}.s-foresporsel-leie-desktop .lbl{font-size:16px;font-weight:600}
.s-foresporsel-leie-desktop .help{font-size:15px;line-height:1.45;color:#4a4a47}
.s-foresporsel-leie-desktop .btn,.s-foresporsel-leie-desktop .btn2{box-sizing:border-box;min-height:52px;padding:0 22px;border:2px solid #2b2b2b;border-radius:6px;background:#2b2b2b;color:#ffffff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.s-foresporsel-leie-desktop .btn2{background:#ffffff;color:#1f1f1f;border-color:#1f1f1f}
.s-foresporsel-leie-desktop .card{border:2px solid #c9c8c3;border-radius:8px;background:#ffffff}
.s-foresporsel-leie-desktop .ph{background:#dcdbd6}
.s-foresporsel-leie-desktop .open{padding:12px 14px;border:2px dashed #8a8a86;border-radius:6px;font-size:15px;line-height:1.45;color:#4a4a47}
.s-foresporsel-leie-desktop .who{align-self:flex-start;padding:6px 12px;border:2px dashed #6f6f6b;border-radius:6px;font-size:14px;font-weight:600;color:#4a4a47;background:#ffffff}
.s-foresporsel-leie-desktop .back{align-self:flex-start;padding:10px 0;font-size:16px}
.s-foresporsel-leie-desktop .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.s-foresporsel-leie-desktop .wd{font-size:14px;font-weight:600;text-align:center;color:#4a4a47;padding:4px 0}
.s-foresporsel-leie-desktop .day{height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;border-radius:4px;box-sizing:border-box}
.s-foresporsel-leie-desktop .free{background:#ffffff;border:1px solid #c9c8c3}
.s-foresporsel-leie-desktop .busy{background:repeating-linear-gradient(45deg,#c9c8c3 0 4px,#e6e5e1 4px 8px);text-decoration:line-through}
.s-foresporsel-leie-desktop .sel{background:#2b2b2b;color:#ffffff;font-weight:700}
.s-foresporsel-leie-desktop a:focus-visible,.s-foresporsel-leie-desktop button:focus-visible,.s-foresporsel-leie-desktop input:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
</style>
</helmet>
<div class="s-foresporsel-leie-desktop" style="width: 1440px; height: 1150px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header class="dhdr"><a href="Sok-desktop.dc.html" class="brand"><span class="logo"></span>[Appnavn]</a><nav class="nav" aria-label="Hovedmeny"><a href="Sok-desktop.dc.html">Annonser</a><a href="Minside-desktop.dc.html">Min side</a><a href="Legg-ut-desktop.dc.html" class="btn2" style="min-height: 44px; padding: 0 18px">Legg ut annonse</a></nav></header>
<main style="padding: 24px 48px 48px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 24px"><a href="Annonse-leie-desktop.dc.html" class="back">‹ Tilbake til annonsen</a><div class="who">Visning: låner</div></div>
<h1>Send låneforespørsel</h1>
<div style="display: flex; gap: 48px">
<form style="width: 820px; flex-shrink: 0; display: flex; flex-direction: column; gap: 24px">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2>Velg periode</h2>
<div style="display: flex; align-items: center; justify-content: space-between"><button type="button" class="ib" aria-label="Forrige måned" style="font-size: 24px">‹</button><strong style="font-size: 18px">Oktober 2026</strong><button type="button" class="ib" aria-label="Neste måned" style="font-size: 24px">›</button></div>
<div class="cal">
<span class="wd">Ma</span><span class="wd">Ti</span><span class="wd">On</span><span class="wd">To</span><span class="wd">Fr</span><span class="wd">Lø</span><span class="wd">Sø</span>
<sc-for list="{{ days }}" as="d" hint-placeholder-count="34">
<div>
<sc-if value="{{ d.busy }}" hint-placeholder-val="{{ false }}"><div class="day busy" aria-label="{{ d.label }}">{{ d.n }}</div></sc-if>
<sc-if value="{{ d.sel }}" hint-placeholder-val="{{ false }}"><button type="button" class="day sel" aria-pressed="true" style="width: 100%; border: 0; font: inherit; font-weight: 700">{{ d.n }}</button></sc-if>
<sc-if value="{{ d.free }}" hint-placeholder-val="{{ true }}"><button type="button" class="day free" style="width: 100%; font: inherit; cursor: pointer">{{ d.n }}</button></sc-if>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 24px; font-size: 15px">
<span style="display: flex; align-items: center; gap: 8px"><span class="busy" style="width: 20px; height: 20px; border-radius: 4px"></span>Utlånt</span>
<span style="display: flex; align-items: center; gap: 8px"><span class="sel" style="width: 20px; height: 20px; border-radius: 4px"></span>Ditt forslag</span>
</div>
</section>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div class="fld"><label for="fd-fra" class="lbl">Fra</label><input id="fd-fra" class="in" type="text" value="20.10.2026"></div>
<div class="fld"><label for="fd-til" class="lbl">Til</label><input id="fd-til" class="in" type="text" value="30.10.2026"></div>
</div>
</form>
<aside style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px">
<div class="card" style="padding: 16px; display: flex; gap: 14px; align-items: center">
<div class="ph" style="width: 80px; height: 80px; border-radius: 6px; flex-shrink: 0"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Skjerm 24 tommer</strong><span style="font-size: 16px">Lån · 100 kr per uke</span><span class="help">Eier: [Fornavn]</span></div>
</div>
<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2>Oppsummering</h2>
<div style="display: flex; justify-content: space-between; font-size: 17px"><span>20.10–30.10 (10 dager)</span><strong>142,86 kr</strong></div>
<button type="button" class="btn">Send forespørsel</button>
</section>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
renderVals() {
const days = [];
for (let i = 0; i < 3; i++) days.push({ n: '', busy: false, sel: false, free: false });
for (let d = 1; d <= 31; d++) {
const busy = d >= 5 && d <= 18;
const sel = d >= 20 && d <= 30;
days.push({ n: d, busy: busy, sel: sel, free: !busy && !sel, label: d + '. oktober, opptatt' });
}
return { days: days };
}
}
</script>
</body>
</html>
