<head>

<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-foresporsler-desktop a{color:#1f1f1f}.s-foresporsler-desktop a:hover{color:#000000}
.s-foresporsler-desktop h1{margin:0;font-size:28px;line-height:1.2}.s-foresporsler-desktop h2{margin:0;font-size:20px;line-height:1.3}.s-foresporsler-desktop p{margin:0}
.s-foresporsler-desktop .hdr{height:60px;box-sizing:border-box;padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c9c8c3;background:#ffffff;flex-shrink:0}
.s-foresporsler-desktop .dhdr{height:72px;box-sizing:border-box;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c9c8c3;background:#ffffff;flex-shrink:0}
.s-foresporsler-desktop .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;text-decoration:none;color:#1f1f1f}
.s-foresporsler-desktop .logo{width:32px;height:32px;box-sizing:border-box;border:2px solid #6f6f6b;border-radius:6px;background:#dcdbd6}
.s-foresporsler-desktop .nav{display:flex;align-items:center;gap:32px;font-size:17px}.s-foresporsler-desktop .nav a{padding:12px 0}.s-foresporsler-desktop .nav a[aria-current]{font-weight:700;text-decoration-thickness:3px;text-underline-offset:6px}
.s-foresporsler-desktop .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;padding:0}
.s-foresporsler-desktop .in{box-sizing:border-box;width:100%;height:52px;padding:0 14px;font:inherit;font-size:18px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-foresporsler-desktop .in[readonly]{background:#ecebe8;border-style:dashed}
.s-foresporsler-desktop .fld{display:flex;flex-direction:column;gap:8px}.s-foresporsler-desktop .lbl{font-size:16px;font-weight:600}
.s-foresporsler-desktop .btn,.s-foresporsler-desktop .btn2{box-sizing:border-box;min-height:48px;padding:0 18px;border:2px solid #2b2b2b;border-radius:6px;background:#2b2b2b;color:#ffffff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.s-foresporsler-desktop .btn2{background:#ffffff;color:#1f1f1f;border-color:#1f1f1f}
.s-foresporsler-desktop .card{border:2px solid #c9c8c3;border-radius:8px;background:#ffffff}
.s-foresporsler-desktop .ph{background:#dcdbd6}
.s-foresporsler-desktop .av{border-radius:50%;background:#dcdbd6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-foresporsler-desktop .help{font-size:15px;line-height:1.45;color:#4a4a47}
.s-foresporsler-desktop .st{font-size:15px;font-weight:600}
.s-foresporsler-desktop .who{align-self:flex-start;padding:6px 12px;border:2px dashed #6f6f6b;border-radius:6px;font-size:14px;font-weight:600;color:#4a4a47;background:#ffffff}
.s-foresporsler-desktop .back{align-self:flex-start;padding:10px 0;font-size:16px}
.s-foresporsler-desktop .tabs{display:flex;border-bottom:2px solid #c9c8c3}
.s-foresporsler-desktop .tabs a{min-height:48px;padding:0 16px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;text-decoration:none;color:#4a4a47;border-bottom:4px solid transparent;margin-bottom:-2px}
.s-foresporsler-desktop .tabs a[aria-current]{color:#1f1f1f;border-bottom-color:#1f1f1f}
.s-foresporsler-desktop .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid #1f1f1f;border-radius:8px;overflow:hidden}
.s-foresporsler-desktop .seg button{min-height:48px;border:0;font:inherit;font-size:17px;font-weight:600;cursor:pointer;background:#ffffff;color:#1f1f1f}
.s-foresporsler-desktop .seg button[aria-pressed=true]{background:#2b2b2b;color:#ffffff}
.s-foresporsler-desktop .turn{align-self:flex-start;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:700;background:#2b2b2b;color:#ffffff}
.s-foresporsler-desktop a:focus-visible,.s-foresporsler-desktop button:focus-visible,.s-foresporsler-desktop input:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
</style>
</helmet>
<div class="s-foresporsler-desktop" style="width: 1440px; height: 1100px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header class="dhdr"><a href="Sok-desktop.dc.html" class="brand" style="font-size: 20px"><span class="logo" style="width: 36px; height: 36px"></span>[Appnavn]</a><nav class="nav" aria-label="Hovedmeny"><a href="Sok-desktop.dc.html">Annonser</a><a href="Minside-desktop.dc.html" aria-current="page">Min side</a><a href="Legg-ut-desktop.dc.html" class="btn2" style="min-height: 44px">Legg ut annonse</a></nav></header>
<main style="padding: 32px 48px 48px; display: flex; gap: 48px">
<aside style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; align-items: flex-start"><div class="who">Visning: innlogget bruker</div><div class="av" style="width: 140px; height: 140px"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#6f6f6b" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></div><div style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 22px">[Fullt navn]</strong><span class="help">[e-post]@hiof.no</span><span class="help">[Telefonnummer]</span></div><a href="Profil-rediger-desktop.dc.html" class="btn2" style="align-self: stretch">Rediger profil</a></aside>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px">
<h1 style="font-size: 32px">Min side</h1>
<nav class="tabs" aria-label="Min side"><a href="Minside-desktop.dc.html">Mine annonser</a><a href="Foresporsler-desktop.dc.html" aria-current="page">Forespørsler</a><a href="Minside-historikk-desktop.dc.html">Historikk</a></nav>
<div style="width: 420px"><div class="seg" role="group" aria-label="Vis forespørsler"><button type="button" aria-pressed="true">Mottatt (3)</button><button type="button" aria-pressed="false">Sendt (2)</button></div></div>
<div style="background: #ffffff; border: 2px solid #c9c8c3; border-radius: 8px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 3fr 1fr 1.2fr 1.4fr 2.2fr 0.6fr; gap: 16px; padding: 14px 16px; border-bottom: 2px solid #c9c8c3; font-size: 15px; font-weight: 600; color: #4a4a47"><span>Vare</span><span>Type</span><span>Fra</span><span>Bud / periode</span><span>Status</span><span></span></div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 3fr 1fr 1.2fr 1.4fr 2.2fr 0.6fr; gap: 16px; padding: 14px 16px; border-bottom: 1px solid #dcdbd6; font-size: 16px; align-items: center">
<div style="display: flex; align-items: center; gap: 12px"><div class="ph" style="width: 48px; height: 48px; border-radius: 6px; flex-shrink: 0"></div><strong>{{ r.title }}</strong></div>
<span>{{ r.type }}</span><span>{{ r.who }}</span><span>{{ r.when }}</span>
<div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font-weight: 600">{{ r.status }}</span><sc-if value="{{ r.mine }}" hint-placeholder-val="{{ false }}"><span class="turn">Din tur</span></sc-if></div>
<a href="{{ r.href }}" style="padding: 10px 0; font-weight: 600">Åpne</a>
</div>
</sc-for>
</div>
</div>
</main>
</div>
