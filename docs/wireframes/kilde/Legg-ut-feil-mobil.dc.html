<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Legg ut annonse med feil, mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-legg-ut-feil-mobil a{color:#1f1f1f}.s-legg-ut-feil-mobil a:hover{color:#000000}
.s-legg-ut-feil-mobil h1{margin:0;font-size:28px;line-height:1.2}.s-legg-ut-feil-mobil h2{margin:0;font-size:18px;line-height:1.3}.s-legg-ut-feil-mobil p{margin:0}
.s-legg-ut-feil-mobil .hdr{height:60px;box-sizing:border-box;padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c9c8c3;background:#ffffff;flex-shrink:0}
.s-legg-ut-feil-mobil .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;text-decoration:none;color:#1f1f1f}
.s-legg-ut-feil-mobil .logo{width:32px;height:32px;box-sizing:border-box;border:2px solid #6f6f6b;border-radius:6px;background:#dcdbd6}
.s-legg-ut-feil-mobil .in{box-sizing:border-box;width:100%;height:48px;padding:0 14px;font:inherit;font-size:17px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-legg-ut-feil-mobil .in.err{border:3px solid #1f1f1f}
.s-legg-ut-feil-mobil .fld{display:flex;flex-direction:column;gap:8px}.s-legg-ut-feil-mobil .lbl{font-size:16px;font-weight:600}
.s-legg-ut-feil-mobil .help{font-size:15px;line-height:1.45;color:#4a4a47}
.s-legg-ut-feil-mobil .errmsg{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.s-legg-ut-feil-mobil .alert{padding:16px;border:3px solid #1f1f1f;border-radius:8px;background:#ffffff;display:flex;flex-direction:column;gap:8px}
.s-legg-ut-feil-mobil .ph{background:#dcdbd6}
.s-legg-ut-feil-mobil a:focus-visible,.s-legg-ut-feil-mobil button:focus-visible,.s-legg-ut-feil-mobil input:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
</style>
</helmet>
<div class="s-legg-ut-feil-mobil" style="width: 390px; height: 1150px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header class="hdr"><a href="Sok-mobil.dc.html" class="brand"><span class="logo"></span>[Appnavn]</a></header>
<main style="padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 24px">
<h1>Legg ut annonse</h1>
<div role="alert" class="alert">
<h2>Rett 3 feil før du publiserer</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 16px">
<li><a href="#le-bilder">Legg til minst ett bilde</a></li>
<li><a href="#le-tittel">Skriv en tittel</a></li>
<li><a href="#le-pris">Pris må være et helt tall</a></li>
</ul>
</div>
<div class="fld" id="le-bilder">
<span class="lbl">Bilder (1–10)</span>
<p class="errmsg"><span aria-hidden="true">✕</span> Legg til minst ett bilde</p>
<button type="button" style="height: 100px; border: 3px dashed #1f1f1f; border-radius: 6px; background: #ffffff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">+ Legg til bilder</button>
</div>
<div class="fld">
<label for="le-tittel" class="lbl">Tittel</label>
<p class="errmsg" id="le-tittel-feil"><span aria-hidden="true">✕</span> Skriv en tittel</p>
<input id="le-tittel" class="in err" type="text" aria-invalid="true" aria-describedby="le-tittel-feil">
</div>
<div class="fld">
<label for="le-pris" class="lbl">Pris per uke (kr, valgfri)</label>
<p class="errmsg" id="le-pris-feil"><span aria-hidden="true">✕</span> Pris må være et helt tall, f.eks. 100</p>
<input id="le-pris" class="in err" type="text" inputmode="numeric" value="100,-" aria-invalid="true" aria-describedby="le-pris-feil">
</div>
<p class="help">[Resten som WF-05]</p>
</main>
</div>
</x-dc>

</body>
</html>
