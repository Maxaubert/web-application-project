<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1f;background:#ecebe8}
.s-sok-feil-mobil .wf-input{box-sizing:border-box;width:100%;height:48px;padding:0 14px;font-size:17px;border:2px solid #6f6f6b;border-radius:6px;background:#ffffff;color:#1f1f1f}
.s-sok-feil-mobil .wf-btn:focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}

<div class="s-sok-feil-mobil" style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f5f2; display: flex; flex-direction: column">
<header style="height: 60px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #c9c8c3; background: #ffffff">
<div style="width: 32px; height: 32px; border: 2px solid #6f6f6b; border-radius: 6px; background: #dcdbd6"></div>
<span style="font-size: 18px; font-weight: 700">[Appnavn]</span>
</header>
<main style="padding: 24px 16px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 28px">Annonser</h1>
<label for="sf-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Søk i tittel og beskrivelse</label>
<input id="sf-q" class="wf-input" type="search" value="kalkulator">
<div role="alert" style="margin-top: 24px; padding: 24px 20px; border: 3px solid #1f1f1f; border-radius: 8px; background: #ffffff; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="7" x2="12" y2="13"></line><line x1="12" y1="17" x2="12" y2="17"></line></svg>
<strong style="font-size: 20px">Kunne ikke hente annonser</strong>
</div>
<button type="button" class="wf-btn" style="align-self: flex-start; height: 48px; padding: 0 24px; border: 0; border-radius: 6px; background: #2b2b2b; color: #ffffff; font-size: 17px; font-weight: 600; cursor: pointer">Prøv igjen</button>
</div>
</main>
</div>
</x-dc>
